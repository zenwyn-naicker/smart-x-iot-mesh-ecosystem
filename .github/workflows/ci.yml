name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartX.slnx

      - name: Build solution
        run: dotnet build SmartX.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SmartX.slnx --configuration Release --no-build --no-restore --verbosity normal
